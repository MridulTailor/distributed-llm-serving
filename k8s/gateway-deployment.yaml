apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: llm-serving
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: distributed-llm-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: VLLM_URL, value: http://vllm:8000}
            - {name: TRITON_URL, value: http://triton:8000}
            - {name: UPSTREAM_TIMEOUT_SECONDS, value: "30"}
            - {name: UPSTREAM_RETRIES, value: "2"}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: llm-serving}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
